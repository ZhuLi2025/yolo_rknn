# yolo_rknn 运行配置。以 # 开头的行会被忽略。
# 命令行 --url / --model / --decode-only 会覆盖这里的同名项。

# ---------- 拉流 ----------
# 本地文件和 rtsp:// 都走同一条解复用路径。示例文件是本机自带的 1080p H.264。
url=/usr/local/test.mp4
# 工业现场固定用 tcp。局域网丢包会让 VPU 花屏或卡住，比 UDP 那一点理论延迟更贵。
transport=tcp
allow_udp=false
# 解复用抖动缓冲上限，微秒。对应 FFmpeg 的 max_delay，不要再用内部符号 ff_url_set_option。
max_delay_us=100000
# 协议层接收缓冲，字节。故意收小，避免套接字里堆一截旧图像。
buffer_size=262144
reorder_queue_size=0
stimeout_us=5000000
probe_size=32768
analyze_duration_us=100000

# ---------- 模型 ----------
# 必须是 RKNN toolkit 1.x 转出来、目标平台 rk3399pro 的模型。不要拿 RKNN2 / RV1126 的模型来跑。
model_path=models/yolov8n.rknn
model_width=640
model_height=640
conf_threshold=0.25
nms_threshold=0.45
num_classes=80
max_detections=64
# 负值表示不按类别过滤。COCO 里 person 是 0。
target_class=-1
# 单输出头的类别分数通常已经是概率；三个 DFL 头的类别分数通常还是 logits。
anchor_scores_are_probabilities=true
dfl_scores_are_logits=true
# true 时不加载 NPU，只验证拉流、硬解和 RGA。也可以用命令行 --decode-only。
decode_only=false

# ---------- 显示 ----------
# 本机 HDMI-A-1 没接显示器时必须保持 false。接上 HDMI 后再改成 true。
# 打开之后：视频层直接扫 VPU 的 NV12，OSD 层画框，两层都 letterbox 到同一块屏幕区域。
display_enable=true
display_device=/dev/dri/card0
display_cpu=1
display_priority=15

# ---------- 线程 ----------
# RK3399Pro：cpu0-3 是 A53，cpu4-5 是 A72。
# 拉流+硬解绑在一颗 A72 上，推理绑在另一颗 A72 上，业务放在 A53。
queue_depth=2
stream_cpu=4
infer_cpu=5
business_cpu=0
stream_priority=50
infer_priority=30
business_priority=20

# ---------- 硬解 ----------
low_latency_decode=true
decoder_buf_count=12

# ---------- 业务 ----------
# 希望目标框高度占画面高度的比例。高度传感器只放大这个误差的增益，误差为 0 时镜头停住。
target_bbox_ratio=0.40
zoom_deadband=0.20
reference_height_m=10
sensor_height_m=10
zoom_cooldown_ms=400
# 空字符串：高度用 sensor_height_m，相机指令只打日志。
# 串口传感器约定为一行一个浮点数（米）。相机串口发 VISCA 变焦。
sensor_device=
camera_device=
camera_baud=9600

log_level=info
stats_interval_ms=2000
