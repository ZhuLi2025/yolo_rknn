# yolo_rknn 运行配置。以 # 开头的行会被忽略。
# 命令行 --url / --model / --decode-only 会覆盖这里的同名项。

# ---------- 拉流 ----------
# 本地文件和 rtsp:// 都走同一条解复用路径。示例是仓库里的 1080p H.264。
url=rtsp://192.168.1.10:8554/live
# 工业现场固定用 tcp。局域网丢包会让 VPU 花屏或卡住，比 UDP 那一点理论延迟更贵。
transport=tcp
allow_udp=false
# 解复用抖动缓冲上限，微秒。对应 FFmpeg 的 max_delay，不要再用内部符号 ff_url_set_option。
max_delay_us=100000
# 协议层接收缓冲，字节。故意收小，避免套接字里堆一截旧图像。
buffer_size=262144
reorder_queue_size=0
stimeout_us=5000000
probe_size=32768
analyze_duration_us=100000

# ---------- 模型 ----------
# 必须是 RKNN-Toolkit2 转出来、目标平台 rk3588 的模型。rk3399pro / RV1126 的 .rknn 不能加载。
# model_type 切换后处理：
#   yolov5  本机这份 int8：三个尺度的 DFL 框 + 类别分数。也接受经典 3 个 anchor 头
#   yolov8  单张 cxcywh 头，或三个合并的 DFL 头
#   yolov3  darknet YOLOv3 / YOLOv3-tiny，多尺度 anchor 头
model_type=yolov5
model_path=weights/yolov5_rk3588_int8.rknn
model_width=640
model_height=640
# letterbox：整幅 1920x1080 缩进 640，上下补灰。物体比训练时的 640 裁块小一截。
# short_side：短边缩到 640，长边裁掉。batch_size=1 时居中裁一块。
# 画面和框仍按原始分辨率显示。模型没看到的区域照常出现在画面上。
preprocess=short_side
# 1：一个 context，下面的 npu_cores 把这一张摊到所选核上。
# 2：只在 short_side 下生效。1920x1080 贴左、贴右各出一张 1080x1080 再缩到 640，
#    两个 context 同时跑，分别绑 NPU core0 和 core1。模型文件不用转成 batch=2。
#    letterbox 下写 2 会退回单张。core2 空着。npu_cores 在这个模式下不使用。
batch_size=2
# RK3588 有 3 个 NPU 核。只在 batch_size=1 时生效。0_1_2 把一帧摊到三核上。
npu_cores=0_1_2
conf_threshold=0.45
nms_threshold=0.45
# 这份 rknn 每个尺度的分数图只有 1 个通道。
num_classes=1
max_detections=64
# 负值表示不按类别过滤。
target_class=-1
anchor_scores_are_probabilities=true
# 分数图已经过 Sigmoid/Clip，不要再做一次 sigmoid。
dfl_scores_are_logits=false
# 经典 YOLOv5 锚点头才用。这份拆开的 DFL 模型留空。
# 宽、高交替，stride 从大到小，每个 stride 三个 anchor。
anchors=
# true 时不加载 NPU，只验证拉流、硬解和 RGA。也可以用命令行 --decode-only。
decode_only=false

# ---------- 显示 ----------
# 本机 HDMI-A-1、HDMI-A-2、DP-1 都没接显示器，必须保持 false。接上后再改成 true。
# 显示节点是 /dev/dri/card0。card1 是 NPU，不能拿来扫屏。
# 打开之后：视频层直接扫 VPU 的 NV12，OSD 层画框，两层都 letterbox 到同一块屏幕区域。
display_enable=true
display_device=/dev/dri/card0
display_cpu=1
display_priority=15

# ---------- 线程 ----------
# RK3588：cpu0-3 是 A55，cpu4-5 是一组 A76，cpu6-7 是另一组更快的 A76。
# 拉流和推理分在两个簇上，业务放在 A55。
queue_depth=2
stream_cpu=6
infer_cpu=4
business_cpu=0
stream_priority=50
infer_priority=30
business_priority=20

# ---------- 硬解 ----------
low_latency_decode=true
decoder_buf_count=12

# ---------- 业务 ----------
# 希望目标框高度占画面高度的比例。高度传感器只放大这个误差的增益，误差为 0 时镜头停住。
target_bbox_ratio=0.40
zoom_deadband=0.20
reference_height_m=10
sensor_height_m=10
zoom_cooldown_ms=400
# 空字符串：高度用 sensor_height_m，相机指令只打日志。
# 串口传感器约定为一行一个浮点数（米）。相机串口发 VISCA 变焦。
sensor_device=
camera_device=
camera_baud=9600

log_level=info
stats_interval_ms=2000
